[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "nexus-registry"
version = "1.0.0"
description = "Canonical dataset registry, JSON Schemas, CLI, and client SDK for the DevSpire Nexus AI Intelligence Directory."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "DevSpire Nexus Contributors", email = "oss@devspirehub.com" }
]
keywords = [
    "ai",
    "ai-tools",
    "ai-models",
    "developer-resources",
    "registry",
    "dataset",
    "catalog"
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Scientific/Engineering :: Artificial Intelligence"
]
dependencies = []

[project.optional-dependencies]
dev = [
    "jsonschema>=4.20.0",
    "pytest>=8.0.0"
]

[project.scripts]
nexus-registry = "nexus_registry.cli:main"

[project.urls]
Homepage = "https://github.com/kumaradoss16/DevSpire-Nexus-Registry"
Repository = "https://github.com/kumaradoss16/DevSpire-Nexus-Registry.git"
"Bug Tracker" = "https://github.com/kumaradoss16/DevSpire-Nexus-Registry/issues"
Documentation = "https://github.com/kumaradoss16/DevSpire-Nexus-Registry#readme"
ParentBrand = "https://devspirehub.com"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"nexus_registry" = [
    "data/datasets/*.json",
    "data/schemas/*.json"
]
