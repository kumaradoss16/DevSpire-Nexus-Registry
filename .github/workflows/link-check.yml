name: Scheduled Link Health Check

on:
  schedule:
    # Run once a week on Sundays at 03:00 UTC
    - cron: '0 3 * * 0'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  link-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          pip install requests==2.32.3

      - name: Run Bounded Link Checker
        run: |
          python scripts/check_links.py --sample 50 --timeout 10
