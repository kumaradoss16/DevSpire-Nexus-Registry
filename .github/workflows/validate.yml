name: Validate Datasets & API Integrity

on:
  push:
    branches: [main]
    paths:
      - 'datasets/**'
      - 'schemas/**'
      - 'src/**'
      - 'scripts/**'
      - 'api/**'
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install .

      - name: Run Schema and Dataset Validation
        run: |
          python -m nexus_registry.cli validate

      - name: Verify Static API Artifacts & Drift Check
        run: |
          python scripts/generate_api.py
          git diff --exit-code api/v1/ || (echo "Error: Static API artifacts in api/v1/ are out of date. Run 'python scripts/generate_api.py' and commit changes." && exit 1)

      - name: Test Wheel Build & Standalone Client Execution
        run: |
          python -m pip install wheel
          pip wheel --no-deps -w dist .
          python -m unittest tests/test_standalone.py
